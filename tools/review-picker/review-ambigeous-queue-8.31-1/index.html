rennan helps America come to terms with his roller-coaster life, which began when he was taken by authorities from his crack-addicted mother, and placed into foster care as an infant. The short time of stability in his life occurred when America lived with Mrs. Harper, the elderly nanny to one of his foster families. Later reunited with his mother, she soon abandons America and he is again placed into foster care. Lagging behind in school and full of anger, America retreats further away from society after years of sexual abuse. After attempting suicide, America is placed in a treatment center where Dr. Brennan helps him open up about his painful past and discover the support and courage he needs to get his life back on track.", "poster_path": "/v42kVCq3FrnkkyNoubWSGSZgnAC.jpg"}, {"id": 59272, "title": "America", "year": "2011", "overview": "Am\u00e9rica, a 30-year-old mother who lives in a remote Caribbean village, suffers the hardest hit when her lover takes her daughter from her. Fury and fear push her to run away. In her new life as a nanny in New York City, with support from relatives and other latinas, Am\u00e9rica finds comfort and hope. When she dares to dream of a life without violence, reality hunts her down. Will she survive to tell her story?", "poster_path": "/oKRmvBXBHIT2RMZc6ejmEqBJmFB.jpg"}, {"id": 11856, "title": "Air America", "year": "1990", "overview": "Air America was the CIA's private airline operating in Laos during the Vietnam War, running anything and everything from soldiers to foodstuffs for local villagers. After losing his pilot's license, Billy Covington is recruited, and ends up in the middle of a bunch of lunatic pilots, gun-running by his friend Gene Ryack, and opium smuggling by his own superiors.", "poster_path": "/2cVANiDU7AdSLGgs4T7dpgyU2SK.jpg"}, {"id": 38225, "title": "Wild America", "year": "1997", "overview": "Three brothers - Marshall, Marty and Mark dream of becoming naturalists and portraying animal life of America. One summer their dream comes true, they travel through America, filming alligators, bears and moose.", "poster_path": "/m9VIy9qtq49EDwgYFg07ganUYg.jpg"}], "source_folder": "out-new-unformatted-8.30", "tag": "Floor Sale"}, {"handle": "american-gun-vhs-floor-sale-drama", "title": "American Gun", "vendor": "VHS", "genre": "drama", "reason": "ambiguous match (best candidate: 'American Gun' (2005))", "candidates": [{"id": 15366, "title": "American Gun", "year": "2005", "overview": "Seemingly disparate portraits of people -- among them a single mother, a high school principal, and an ace student -- Distinctly American -- all affected by the proliferation of guns in American society.", "poster_path": "/1GikvdDanJwSQOb0oCWY5FqFTxZ.jpg"}, {"id": 62190, "title": "American Gun", "year": "2002", "overview": "A father uses the serial number on a hand gun in an attempt to track down his daughter's killer. The truth he uncovers is an unsettling reminder of the dangers of keeping handguns.", "poster_path": "/7oJNiMYFQsn992Tm0fVFCmvMytx.jpg"}, {"id": 103031, "title": "American Guns", "year": "2011", "overview": "The Wyatts are your typical suburban family... who just happen to own one of the premiere firearms facilities in the world. Rich Wyatt and his wife Renee own Gunsmoke, located outside Denver, Colorado, where they buy, sell and trade guns \u2014 from hand cannons to hunting rifles. And if you don't see what you want, they'll build one for you \u2014 from nothing more than a block of metal. Gunsmoke has the largest and most experienced group of gunsmiths in the state. When the Wyatts aren't building or selling guns, they're shooting them. No gun leaves their shop without being test fired by the family first. They \u2014 and the one-of-a-kind and historic guns they make and sell \u2014 are featured in AMERICAN GUNS.", "poster_path": ""}, {"id": 1690998, "title": "American Commando 9: Guns to Heaven", "year": "1989", "overview": "After losing on a bad investment and falling in debt with a loan shark, Peter Yang turns to gambling, but with the help of an honest gambler, Bobby Chu, starts to win big time. This infuriates a ruthless game player, Tommy Chao, who does everything in his power to cheat them.", "poster_path": "/tp0aFdUrCYAeiyiV0U8h0Wdqprp.jpg"}], "source_folder": "out-new-unformatted-8.30", "tag": "Floor Sale"}, {"handle": "american-pie-dvd-floor-sale-comedy", "title": "American Pie", "vendor": "DVD", "genre": "comedy", "reason": "ambiguous match (best candidate: 'American Pie' (1999))", "candidates": [{"id": 2105, "title": "American Pie", "year": "1999", "overview": "At a high-school party, four friends find that losing their collective virginity isn't as easy as they had thought. But they still believe that they need to do so before college. To motivate themselves, they enter a pact to all \"score\" by their senior prom.", "poster_path": "/5P68by2Thn8wHAziyWGEw2O7hco.jpg"}, {"id": 421382, "title": "American Pie", "year": "1972", "overview": "Rapidly edited animation set to Don McLean's song \"American Pie.\" Screened in the 1972 New York Film Festival.", "poster_path": ""}, {"id": 2770, "title": "American Pie 2", "year": "2001", "overview": "After a year apart - attending different schools, meeting different people - the guys rent a beach house and vow to make this the best summer ever. As it turns out, whether that will happen or not has a lot to do with the girls. Between the wild parties, outrageous revelations and yes, a trip to band camp, they discover that times change and people change, but in the end, it's all about sticking together.", "poster_path": "/854ZZxXdeabAs90mrV72NqShJqR.jpg"}, {"id": 63404, "title": "American Pie: Revealed", "year": "2004", "overview": "Documentary about the making of American Pie (1999), American Pie 2 (2001) and American Wedding (2003).", "poster_path": "/zd6vScAUAp3blRMa2ZCsFY2SUNk.jpg"}, {"id": 25081, "title": "The American Trap", "year": "2008", "overview": "The world is still reeling from the assassination of JFK - but has yet to lose his kid brother Bobby. In the midst of all this, a reluctant hero by the name of Lucien Rivard becomes enmeshed in a web of global political intrigue and corruption.", "poster_path": "/eu1irKDsgkO2Be6mwqIY1aRYK99.jpg"}], "source_folder": "out-product_export_5", "tag": "Floor Sale"}, {"handle": "american-women", "title": "American Women", "vendor": "VHS", "genre": "comedy", "reason": "ambiguous match (best candidate: 'Home-land: Hmong American Women' (2025))", "candidates": [{"id": 520891, "title": "Women in American Horse Racing", "year": "2007", "overview": "The story of women in racing is more and more the story of racing itself.", "poster_path": ""}, {"id": 20648, "title": "100 Women", "year": "2002", "overview": "A young man returns to his ex-girlfriend and true love to discover the source of her increasing depression. As the young man earnestly tries to help his girlfriend through her troubles, their love begins to bloom.", "poster_path": "/8ssSg7Bm05i4QRIQWdkGKLpALQx.jpg"}, {"id": 1748962, "title": "Japanese American Women: a Sense of Place", "year": "1992", "overview": "The stereotype of the polite, docile, exotic Asian woman is shattered in this documentary in which a dozen women speak about their experiences as part of the \"model minority.\" JAPANESE AMERICAN WOMEN explores the ambivalent feelings the women have both towards Japan and the United States. The underlying theme is the burden of being different, of being brought up \u201cone of a kind\u201d as opposed to growing up part of an ethnic community. An uneasy feeling prevails of being neither Japanese nor American, and the documentary ultimately becomes the story of Japanese American women and their search for a sense of place.", "poster_path": "/90ec4vDj1Espn39EFuLpKlxDjum.jpg"}, {"id": 950980, "title": "Cowgirls: Portraits of American Ranch Women", "year": "1985", "overview": "The cowgirls in this documentary are modern-day women aged six to sixty, who ride cian is preparing to expose a financial scandal. But then a woman who has invested heavily in the shady venture threatens to uncover a damaging secret in the politician's past if he exposes the speculation as a fraud. His problem is compounded by his wife's intolerance of the slightest character flaws.", "poster_path": "/ivoNvbYf82RRtTnqlKuWjypZdZP.jpg"}], "source_folder": "out-product_export_7", "tag": "Floor Sale"}, {"handle": "angel-of-death", "title": "Angel of Death", "vendor": "VHS", "genre": "action", "reason": "ambiguous match (best candidate: 'Angel of Death' (1990))", "candidates": [{"id": 272061, "title": "Angel of Death", "year": "2013", "overview": "Steven Seagal reprises his role as Seattle undercover cop Elijah Kane in this action thriller from the True Justice series. Responding to fresh intel, Kane and his team have to intercept and neutralise the threat from terrorists attempting to offload nuclear bombs hidden in two smuggled suitcases. If that wasn't bad enough, Kane is convinced that 'The Ghost' is trying to lay his hands on them.", "poster_path": "/1QrwN6w58o4aWt3rV4bEPtiFXwd.jpg"}, {"id": 20781, "title": "Angel of Death", "year": "2009", "overview": "A career assassin becomes haunted by one of her victims following a near fatal injury to her brain. Becoming a rogue assassin settling the score with her former mob employers, chaos and power struggles ensue.", "poster_path": "/xbNgVKUVOhe4x3ZChhX8hHTzvgY.jpg"}, {"id": 30883, "title": "Angel of Death", "year": "1985", "overview": "A Jewish commando unit hunting Nazi war criminals tracks down the infamous Dr. Mengele in the jungle, and find that he is torturing nubile young virgins and performing horrible medical experiments on the locals. They prepare to battle their way past Mengele's hordes of fanatic Nazi bodyguards in order to get to him.", "poster_path": "/W6aGNbBc3aWeb8XFij7NzQHn7k.jpg"}, {"id": 72806, "title": "Angel of Death", "year": "2002", "overview": "The most spectacular Easter celebr tag": "Floor Sale"}, {"handle": "body-of-evidence-vhs-floor-sale-thriller", "title": "Body of Evidence", "vendor": "VHS", "genre": "thriller", "reason": "ambiguous match (best candidate: 'Body of Evidence' (1993))", "candidates": [{"id": 2149, "title": "Body of Evidence", "year": "1993", "overview": "When an elderly millionaire is found dead with cocaine in his system, his will leaves $8 million to Rebecca Carlson, who was having an affair with him. District attorney Robert Garrett decides to prosecute Rebecca, arguing that she deliberately engaged in wild sex with the old man to overexcite him and lead to his premature death. Defense attorney Frank Dulaney defends Rebecca in court while getting sucked into a dangerous affair with her.", "poster_path": "/rGDfwZHRMpY5R0ZkmaiHHvpYQKB.jpg"}, {"id": 645174, "title": "Body of Evidence", "year": "1988", "overview": "Nurse Carol Dwyer suspects that her new husband Alex, a forensic psychologist, may be responsible for serial murders in their neighborhood.", "poster_path": "/k0V6cXVqFfoBYz3Qp6sm6Q4ibV7.jpg"}, {"id": 553252, "title": "Darrow & Darrow: Body of Evidence", "year": "2018", "overview": "Claire finds herself defending a woman already convicted of murder, while Miles questions his role as prosecuting attorney and helps her on the case.", "poster_path": "/nwl7xvAO4wbGDTSmtAL7h6OmfU9.jpg"}, {"id": 1605352, "title": "Body of Evidence: Cells and Tissues", "year": "", "overview": "The human body is composed of many types of cells. But none of them perform their function well on their own because they were designed to function as part of something much more complexyou! An adult has about a hundred trillion cells arranged in four primary tissues that make up all the organs of the body. The four tissues are epithelium, connective tissue, muscle, and nerve. An understanding of these primary tissues greatly aids in understanding the structure and function of the organs of the body. Although our skin and kidneys look totally different to the unaided eye, under the microscope they are seen to be made up of a unique combination of the same four primary tissues.", "poster_path": "/dCe3LmTNsIMULnaDn0HCLatSLfc.jpg"}, {"id": 1605353, "title": "Body of Evidence: The Urinary System", "year": "", "overview": "The kidneys rid the body of the waste products of protein metabolism in the form of urea and maintain a balance of salts, water, and other substances. The kidneys unusual approach for ridding the bloodstream of unwanted substances is to essentially throw nearly everything out and then absorb back what the body needs. The three basic functions of the kidneysfiltration, excretion, and absorptionare carried out by nearly 2 million filtering units called nephrons.", "poster_path": "/yln5pik2HnrHnqlv5t4P7ddrPbP.jpg"}], "source_folder": "out-product_export_6", "tag": "Floor Sale"}, {"handle": "boys-dont-cry-vhs-floor-sale-drama", "title": "Boys Don't Cry", "vendor": "VHS", "genre": "drama", "reason": "ambiguous match (best candidate: 'Boys Don't Cry' (1999))", "candidates": [{"id": 226, "title": "Boys Don't Cry", "year": "1999", "overview": "A young transgender man explores his gender identity and searches for love in rural Nebraska.", "poster_path": "/eB505ycEhFVfMwGglIzXNUyKAIs.jpg"}, {"id": 989910, "title": "Boys Don't Cry", "year": "", "overview": "Michael, a young man working in an off-licence store is looking for interaction with his customers. Upon seemingly finding a genuine connection with customer Rachel, his bottled-up emotions come to the surface.", "poster_path": "/sWub7i17Gc1fcozGokcp6cnDPqR.jpg"}, {"id": 1419194, "title": "Boys Don't Cry", "year": "1974", "overview": "The film tells the story of a father who is released from prison and reunites with his son after many years, and how their relationship is reshaped.", "poster_path": "/1dmXfCUFEyZ0ZjwfrqGSCHHayfc.jpg"}, {"id": 953663, "title": "Boys Don't Cry", "year": "1995", "overview": "The original short film that inspired the 1999 const BATCH_ID = "review-ambigeous-queue-8.31-1";
const STORAGE_KEY = "tmdb-review-picks::" + BATCH_ID;
const MANUAL_KEY = "tmdb-review-manual::" + BATCH_ID;
const HIDE_DECIDED_KEY = "tmdb-review-hide-decided::" + BATCH_ID;
const RENTAL_ONLY_KEY = "tmdb-review-rental-only::" + BATCH_ID;
const PENDING_KEY = "tmdb-review-pending::" + BATCH_ID;

const MANUAL_DEBOUNCE_MS = 1500;
const MAX_SAVE_ATTEMPTS = 5;
const RETRY_BASE_MS = 3000;

function loadCache(key) {
  try { return JSON.parse(localStorage.getItem(key)) || {}; }
  catch (e) { return {}; }
}
function saveCache() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(picks));
  localStorage.setItem(MANUAL_KEY, JSON.stringify(manualData));
}

let picks = loadCache(STORAGE_KEY);
let manualData = loadCache(MANUAL_KEY);
let saveState = {};
const debounceTimers = {};

// Handles whose save has been started but not confirmed by the server. Persisted
// so a reload mid-failure does not silently drop the pick: on load we re-POST
// anything still pending that the server does not already have.
function loadPending() {
  try {
    const raw = JSON.parse(localStorage.getItem(PENDING_KEY));
    return Array.isArray(raw) ? raw : [];
  } catch (e) { return []; }
}
let pending = loadPending();
function persistPending() {
  localStorage.setItem(PENDING_KEY, JSON.stringify(pending));
}
function markPending(handle) {
  if (pending.indexOf(handle) === -1) { pending.push(handle); persistPending(); }
}
function clearPending(handle) {
  const i = pending.indexOf(handle);
  if (i !== -1) { pending.splice(i, 1); persistPending(); }
}

// Returns the candidate index (as a string), "manual", "skip", or null when a
// stored "tmdb" pick matches none of this page-load's candidates. null means
// "leave undecided" -- never silently downgrade a good tmdb pick to a blank
// manual one, which the client could then overwrite with nothing.
function pickChoiceIndex(product, remotePick) {
  if (remotePick.choice === "manual") return "manual";
  if (remotePick.choice === "skip") return "skip";
  let idx = product.candidates.findIndex(
    c => c.poster_path === remotePick.poster_path && c.overview === remotePick.overview);
  if (idx === -1) {
    // poster_path is the stable identifier; overview text drifts between TMDB fetches.
    idx = product.candidates.findIndex(
      c => c.poster_path && c.poster_path === remotePick.poster_path);
  }
  return idx === -1 ? null : String(idx);
}

function matchesRemote(handle, value, remotePick) {
  if (!remotePick) return false;
  const payload = buildPayload(handle, value);
  if (remotePick.choice !== payload.choice) return false;
  if (payload.choice === "tmdb") return (remotePick.poster_path || "") === (payload.poster_path || "");
  if (payload.choice === "manual") {
    return (remotePick.image_src || "") === payload.image_src
      && (remotePick.overview || "") === payload.overview;
  }
  return true;
}

function resendPending(remotePicks) {
  const byHandle = {};
  for (const remotePick of remotePicks) byHandle[remotePick.handle] = remotePick;
  for (const handle of pending.slice()) {
    const value = picks[handle];
    if (value === undefined) { clearPending(handle); continue; }
    // A debounced save for this handle is already queued -- don't double-POST.
    if (debounceTimers[handle]) continue;
    if (matchesRemote(handle, value, byHandle[handle])) {
      clearPending(handle);
      setSaveState(handle, "saved");
      continue;
    }
    savePick(handle, value);
  }
}

async function hydrateFromServer() {
  let remotePicks = [];
  try {
    const response = await fetch("/api/get-picks?batch=review-ambigeous-queue-8.31-1");
    if (!response.ok) return;
    remotePicks = await response.json();
    if (!Array.isArray(remotePicks)) return;
    for (const remotePick of remotePicks) {
      const product = PRODUCTS.find(p => p.handle === remotePick.handle);
      if (!product) continue;
      // A locally pending handle holds a newer, unconfirmed value -- don't clobber it.
      if (pending.indexOf(remotePick.handle) !== -1) continue;
      const choice = pickChoiceIndex(product, remotePick);
      if (choice === null) {
        delete picks[remotePick.handle];
        continue;
      }
      picks[remotePick.handle] = choice;
      if (remotePick.choice === "manual") {
        manualData[remotePick.handle] = { image_src: remotePick.image_src || "", overview: remotePick.overview || "" };
      }
    }
    saveCache();
    render();
  } catch (e) { /* offline or first load with nothing saved yet -- localStorage cache still applies */ }
  resendPending(remotePicks);
}

function esc(text) {
  const div = document.createElement("div");
  div.textContent = text || "";
  return div.innerHTML;
}

function optionHtml(handle, value, checked, extraClass, inner) {
  return `<label class="option ${extraClass}">
    <input type="radio" name="pick-${esc(handle)}" value="${value}" ${checked ? "checked" : ""}>
    ${inner}
  </label>`;
}

function saveStateLabel(state) {
  if (state === "saving") return "Saving…";
  if (state === "saved") return "Saved ✓";
  if (state === "failed") return "Not saved — save failed";
  if (state === "error") return "Not saved — retrying";
  return "";
}

function saveStateHtml(handle) {
  const state = saveState[handle] || "";
  return `<span class="save-state ${state}">${saveStateLabel(state)}</span>`;
}

function cardFor(handle) {
  const cards = document.getElementById("cards").children;
  for (const card of cards) {
    if (card.dataset.handle === handle) return card;
  }
  return null;
}

// Update only this card's save-state indicator. Never re-render: a full render()
// destroys the DOM (and focus/caret) of any manual field being typed into.
function setSaveState(handle, state) {
  saveState[handle] = state;
  const card = cardFor(handle);
  if (!card) return;
  const span = card.querySelector(".save-state");
  if (!span) return;
  span.className = "save-state " + state;
  span.textContent = saveStateLabel(state);
}

function markDecided(handle) {
  const card = cardFor(handle);
  if (card) card.classList.add("decided");
  updateCounter();
}

function render() {
  const cards = document.getElementById("cards");
  cards.innerHTML = PRODUCTS.map(product => {
    const current = picks[product.handle];
    const searchUrl = "https://www.themoviedb.org/search?query=" + encodeURIComponent(product.title);
    const googleUrl = "https://www.google.com/search?q=" + encodeURIComponent(product.title + " movie");
    const options = product.candidates.map((candidate, i) => {
      const poster = candidate.poster_path
        ? `<img src="https://image.tmdb.org/t/p/w185${esc(candidate.poster_path)}" alt="" loading="lazy">`
        : '<div class="no-poster">no poster</div>';
      const overview = candidate.overview ? esc(candidate.overview) : "<em>(no overview)</em>";
      return optionHtml(product.handle, String(i), current === String(i), "",
        `${poster}<span class="info"><strong>${esc(candidate.title)}</strong> (${esc(candidate.year) || "?"})<br>${overview}</span>`);
    }).join("");
    const plainTags = [product.vendor, product.genre].filter(Boolean).map(t => `<span class="tag">${esc(t)}</span>`);
    const scopeTag = product.tag ? [`<span class="tag ${product.tag === "Rental" ? "rental" : ""}">${esc(product.tag)}</span>`] : [];
    const allTags = [...plainTags, ...scopeTag];
    const tagsHtml = allTags.length ? `<span class="tags">${allTags.join("")}</span>` : "";
    const cardTagClass = product.tag === "Rental" ? "tag-rental" : product.tag === "Floor Sale" ? "tag-floor-sale" : "";
    return `<section class="card ${current !== undefined ? "decided" : ""} ${cardTagClass}" data-handle="${esc(product.handle)}">
      <h2>${esc(product.title)} ${tagsHtml} ${saveStateHtml(product.handle)}</h2>
      <div class="meta"><code>${esc(product.handle)}</code> — ${esc(product.reason)}
        · <a href="${searchUrl}" target="_blank">TMDB search</a>
        · <a href="${googleUrl}" target="_blank">Google</a></div>
      <div class="candidates">
        ${options}
        <div class="secondary-options">
          ${optionHtml(product.handle, "manual", current === "manual", "special",
            `<span class="info"><strong>Type it in myself</strong>
              <span class="manual-fields">
                <input type="url" class="manual-image" placeholder="Image URL (leave blank to keep current)"
                       value="${esc((manualData[product.handle] || {}).image_src || "")}">
                <textarea class="manual-overview" placeholder="Description (leave blank to keep current)">${esc((manualData[product.handle] || {}).overview || "")}</textarea>
              </span>
            </span>`)}
          ${optionHtml(product.handle, "skip", current === "skip", "special",
            '<span class="info"><strong>None of these match — skip</strong></span>')}
        </div>
      </div>
    </section>`;
  }).join("");
  updateCounter();
}

function visibleProducts() {
  return document.body.classList.contains("rental-only")
    ? PRODUCTS.filter(p => p.tag === "Rental")
    : PRODUCTS;
}

function updateCounter() {
  const shown = visibleProducts();
  const decided = shown.filter(p => picks[p.handle] !== undefined).length;
  document.getElementById("counter").textContent = `${decided} / ${shown.length} decided`;
}

const hideDecidedBox = document.getElementById("hide-decided");
hideDecidedBox.checked = localStorage.getItem(HIDE_DECIDED_KEY) === "1";
document.body.classList.toggle("hide-decided", hideDecidedBox.checked);
hideDecidedBox.addEventListener("change", () => {
  document.body.classList.toggle("hide-decided", hideDecidedBox.checked);
  localStorage.setItem(HIDE_DECIDED_KEY, hideDecidedBox.checked ? "1" : "0");
});

const rentalOnlyBox = document.getElementById("rental-only");
rentalOnlyBox.checked = localStorage.getItem(RENTAL_ONLY_KEY) === "1";
document.body.classList.toggle("rental-only", rentalOnlyBox.checked);
rentalOnlyBox.addEventListener("change", () => {
  document.body.classList.toggle("rental-only", rentalOnlyBox.checked);
  localStorage.setItem(RENTAL_ONLY_KEY, rentalOnlyBox.checked ? "1" : "0");
  updateCounter();
});

function buildPayload(handle, value) {
  if (value === "skip") return { batch: BATCH_ID, handle, choice: "skip" };
  if (value === "manual") {
    const fields = manualData[handle] || {};
    return { batch: BATCH_ID, handle, choice: "manual", image_src: fields.image_src || "", overview: fields.overview || "" };
  }
  const product = PRODUCTS.find(p => p.handle === handle);
  const candidate = product.candidates[Number(value)];
  return { batch: BATCH_ID, handle, choice: "tmdb", poster_path: candidate.poster_path, overview: candidate.overview };
}

async function savePick(handle, value, attempt) {
  attempt = attempt || 0;
  markPending(handle);
  setSaveState(handle, "saving");
  try {
    const response = await fetch("/api/save-pick", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(buildPayload(handle, value)),
    });
    if (!response.ok) throw new Error("save failed");
    setSaveState(handle, "saved");
    clearPending(handle);
  } catch (e) {
    if (attempt + 1 >= MAX_SAVE_ATTEMPTS) {
      // Out of retries: leave a persistent error state rather than looping forever.
      // The handle stays in `pending`, so a reload re-attempts it.
      setSaveState(handle, "failed");
      return;
    }
    setSaveState(handle, "error");
    setTimeout(() => {
      // Abandon this retry if a newer save has superseded it -- otherwise a stale
      // queued retry can clobber the client's correction with the old value.
      if (picks[handle] !== value) return;
      if (debounceTimers[handle]) return;
      savePick(handle, value, attempt + 1);
    }, RETRY_BASE_MS * Math.pow(2, attempt));
  }
}

// Manual free-text saves are debounced: each save is a git commit, so saving on
// every keystroke would produce one commit (and one Pages deploy) per character.
function queueManualSave(handle) {
  markPending(handle);
  clearTimeout(debounceTimers[handle]);
  debounceTimers[handle] = setTimeout(() => {
    delete debounceTimers[handle];
    savePick(handle, "manual");
  }, MANUAL_DEBOUNCE_MS);
}

document.getElementById("cards").addEventListener("change", event => {
  const input = event.target;
  if (input.type !== "radio") return;
  const handle = input.closest(".card").dataset.handle;
  picks[handle] = input.value;
  saveCache();
  markDecided(handle);
  savePick(handle, input.value);
});

document.getElementById("cards").addEventListener("input", event => {
  const input = event.target;
  if (!input.classList.contains("manual-image") && !input.classList.contains("manual-overview")) return;
  const card = input.closest(".card");
  const handle = card.dataset.handle;
  const fields = manualData[handle] || {};
  if (input.classList.contains("manual-image")) fields.image_src = input.value;
  else fields.overview = input.value;
  manualData[handle] = fields;
  if (picks[handle] !== "manual") {
    picks[handle] = "manual";
    const radio = card.querySelector('input[type="radio"][value="manual"]');
    if (radio) radio.checked = true;
  }
  saveCache();
  markDecided(handle);
  queueManualSave(handle);
});

render();
hydrateFromServer();
</script>
