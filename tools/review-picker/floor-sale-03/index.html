ild an elaborate resort in the Blue Mountains of Australia that he ignores certain obvious signals that his business partner is not entirely on the up-and-up. After a brush fire destroys the resort, an insurance investigator comes nosing around, whom Howard's partner deals with in a drastic manner. By the time Lloyds of London's senior investigator George Engels (James Mason in one of his last roles) arrives on the scene, Howard (Tom Skerritt) is anxious to set things to rights.", "poster_path": "/9nLX9hCRhNRzR6oSHLPmurtJ2PZ.jpg"}], "tag": "Floor Sale"}, {"handle": "fool-proof-vhs", "title": "Fool Proof", "vendor": "VHS", "genre": "action", "reason": "ambiguous match (best candidate: 'Fool Proof' (1923))", "candidates": [{"id": 809210, "title": "Fool Proof", "year": "1923", "overview": "A 1924 Neal Burns comedy. To show his son that there\u2019s more to life than work, a rich man pretends he is getting married to a chorus girl.", "poster_path": ""}, {"id": 1418201, "title": "Fool Proof", "year": "2002", "overview": "Fool Proof takes us on an international roller coaster ride as we explore the history and art of clowning. With professional clown Beni Malone as ringmaster, this one hour documentary is a visual feast which celebrates the rich history and recent renaissance of the most animated of performing arts. This journey comes full circle when Malone is joined on stage by his aerialist daughter, Anahareo. Fool Proof combines rare archival footage with fascinating real life stories, to create a springboard into the world phenomena of circus arts.", "poster_path": ""}], "tag": "Floor Sale"}, {"handle": "for-richer-for-poorer-vhs-floor-sale-comedy", "title": "For Richer, For Poorer", "vendor": "VHS", "genre": "comedy", "reason": "ambiguous match (best candidate: 'For Richer or Poorer' (1997))", "candidates": [{"id": 59136, "title": "For Richer, for Poorer", "year": "1992", "overview": "Fresh out of college, a young man lazes about his family's estate, which irritates ds as the most turn of events leads the extended Dingle family into two parallel but polar opposite futures.  Will it be the reality of winning the lottery that brings delight, or will the harsher reality of lies and bogus tickets leave the clan counting the cost of nearly winning a fortune? The havoc unfolds with hilarious results as the film asks the question \u2018How much would winning the lottery change you?\u2019", "poster_path": "/3RSL1FldBbASaqv8gpYdyIJ42RU.jpg"}], "tag": "Floor Sale"}, {"handle": "forbidden-choices-vhs-floor-sale-thriller", "title": "Forbidden Choices", "vendor": "VHS", "genre": "thriller", "reason": "ambiguous match (best candidate: 'The Beans of Egypt, Maine' (1994))", "candidates": [{"id": 218473, "title": "The Beans of Egypt, Maine", "year": "1994", "overview": "The Beans are poor, proud, hated by all, but alive in the sense that they struggle against their lot and support each other in time of trouble. Earlene lives across the street from the Bean's trailer, and the view from her window is better than any daytime television soap opera; especially Beal Bean, and especially Beal Bean shirtless. When Reuben Bean is sent to prison for resisting arrest for out-of-season deer hunting, Beal takes up with Reuben's woman Roberta. He also has a child by Earlene, with a triangle of sex complicated by poverty.", "poster_path": "/aPhwUrsviNrbBs8khuDHsnX9cn9.jpg"}], "tag": "Floor Sale"}, {"handle": "forever-young-vhs-floor-sale-drama", "title": "Forever Young", "vendor": "VHS", "genre": "drama", "reason": "ambiguous match (best candidate: 'Forever Young' (1992))", "candidates": [{"id": 10326, "title": "Forever Young", "year": "1992", "overview": "A 1939 test pilot asks his best friend to use him as a guinea pig for a cryogenics experiment. Daniel McCormick wants to be frozen for a year so that he doesn't have to watch his love lying in a coma. The next thing Daniel knows is that he's been awoken in 1992.", "poster_path": "/eKbD77BEhhBmFD7ZE9VTi9o8r2 e story of how a team of Australian officers used aerial intelligence, emerging technology and innovative tactics to plan the landing at Anzac Cove.  It is now nearly 100 years since the landing and hundreds of books, movies and documentaries have failed to grasp the significance of the ANZAC achievement.  Instead, the mythology has clouded the real story of how these two influential Australian officers took control of the landing using every innovation they could muster to safely land their men on Z beach.", "poster_path": "/gDEMOWVykAIkaEt99hFK2iTAHbA.jpg"}], "tag": "Floor Sale"}, {"handle": "gamer-dvd-floor-sale-action", "title": "Gamer", "vendor": "DVD", "genre": "action", "reason": "ambiguous match (best candidate: 'Gamer' (2009))", "candidates": [{"id": 18501, "title": "Gamer", "year": "2009", "overview": "Mind-control technology has taken society by a storm, a multiplayer on-line game called \"Slayers\" allows players to control human prisoners in mass-scale. Simon controls Kable, the online champion of the game. Kable's ultimate challenge becomes regaining his identity and independence by defeating the game's mastermind.", "poster_path": "/d5BTNmr87p7EvguTFW72vlL9l9H.jpg"}, {"id": 82495, "title": "Gamer", "year": "2001", "overview": "Tony is crazy about video games. But he is arrested during a hold-up which failed, and he goes to prison for eight months. When he gets out, he contacts Valery, GameStar's boss, and offers her a new video game concept.", "poster_path": "/xtcZ1WrtvexoOcH9sB4cSIDm9Nq.jpg"}, {"id": 373836, "title": "Gamer", "year": "2014", "overview": "Allu, Omar, and Surya are three close friends who go for a journey with a special aim. In an accident they are saved by Zacharia who seems to have a different personality. The three friends have to stay at Zacharia\u2019s bungalow at certain special circumstances. Zacharia\u2019s bungalow is on a hilltop. He is a person with no specific aim in life and is in his 60s. There the three friends come acro         ${options}
        <div class="secondary-options">
          ${optionHtml(product.handle, "manual", current === "manual", "special",
            `<span class="info"><strong>Type it in myself</strong>
              <span class="manual-fields">
                <input type="url" class="manual-image" placeholder="Image URL (leave blank to keep current)"
                       value="${esc((manualData[product.handle] || {}).image_src || "")}">
                <textarea class="manual-overview" placeholder="Description (leave blank to keep current)">${esc((manualData[product.handle] || {}).overview || "")}</textarea>
              </span>
            </span>`)}
          ${optionHtml(product.handle, "skip", current === "skip", "special",
            '<span class="info"><strong>None of these match — skip</strong></span>')}
        </div>
      </div>
    </section>`;
  }).join("");
  updateCounter();
}

function visibleProducts() {
  return document.body.classList.contains("rental-only")
    ? PRODUCTS.filter(p => p.tag === "Rental")
    : PRODUCTS;
}

function updateCounter() {
  const shown = visibleProducts();
  const decided = shown.filter(p => picks[p.handle] !== undefined).length;
  document.getElementById("counter").textContent = `${decided} / ${shown.length} decided`;
}

const hideDecidedBox = document.getElementById("hide-decided");
hideDecidedBox.checked = localStorage.getItem(HIDE_DECIDED_KEY) === "1";
document.body.classList.toggle("hide-decided", hideDecidedBox.checked);
hideDecidedBox.addEventListener("change", () => {
  document.body.classList.toggle("hide-decided", hideDecidedBox.checked);
  localStorage.setItem(HIDE_DECIDED_KEY, hideDecidedBox.checked ? "1" : "0");
});

const rentalOnlyBox = document.getElementById("rental-only");
rentalOnlyBox.checked = localStorage.getItem(RENTAL_ONLY_KEY) === "1";
document.body.classList.toggle("rental-only", rentalOnlyBox.checked);
rentalOnlyBox.addEventListener("change", () => {
  document.body.classList.toggle("rental-only", rentalOnlyBox.checked);
  localStorage.setItem(RENTAL_ONLY_KEY, rentalOnlyBox.checked ? "1" : "0");
  updateCounter();
});

function buildPayload(handle, value) {
  if (value === "skip") return { batch: BATCH_ID, handle, choice: "skip" };
  if (value === "manual") {
    const fields = manualData[handle] || {};
    return { batch: BATCH_ID, handle, choice: "manual", image_src: fields.image_src || "", overview: fields.overview || "" };
  }
  const product = PRODUCTS.find(p => p.handle === handle);
  const candidate = product.candidates[Number(value)];
  return { batch: BATCH_ID, handle, choice: "tmdb", poster_path: candidate.poster_path, overview: candidate.overview };
}

async function savePick(handle, value, attempt) {
  attempt = attempt || 0;
  markPending(handle);
  setSaveState(handle, "saving");
  try {
    const response = await fetch("/api/save-pick", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(buildPayload(handle, value)),
    });
    if (!response.ok) throw new Error("save failed");
    setSaveState(handle, "saved");
    clearPending(handle);
  } catch (e) {
    if (attempt + 1 >= MAX_SAVE_ATTEMPTS) {
      // Out of retries: leave a persistent error state rather than looping forever.
      // The handle stays in `pending`, so a reload re-attempts it.
      setSaveState(handle, "failed");
      return;
    }
    setSaveState(handle, "error");
    setTimeout(() => {
      // Abandon this retry if a newer save has superseded it -- otherwise a stale
      // queued retry can clobber the client's correction with the old value.
      if (picks[handle] !== value) return;
      if (debounceTimers[handle]) return;
      savePick(handle, value, attempt + 1);
    }, RETRY_BASE_MS * Math.pow(2, attempt));
  }
}

// Manual free-text saves are debounced: each save is a git commit, so saving on
// every keystroke would produce one commit (and one Pages deploy) per character.
function queueManualSave(handle) {
  markPending(handle);
  clearTimeout(debounceTimers[handle]);
  debounceTimers[handle] = setTimeout(() => {
    delete debounceTimers[handle];
    savePick(handle, "manual");
  }, MANUAL_DEBOUNCE_MS);
}

document.getElementById("cards").addEventListener("change", event => {
  const input = event.target;
  if (input.type !== "radio") return;
  const handle = input.closest(".card").dataset.handle;
  picks[handle] = input.value;
  saveCache();
  markDecided(handle);
  savePick(handle, input.value);
});

document.getElementById("cards").addEventListener("input", event => {
  const input = event.target;
  if (!input.classList.contains("manual-image") && !input.classList.contains("manual-overview")) return;
  const card = input.closest(".card");
  const handle = card.dataset.handle;
  const fields = manualData[handle] || {};
  if (input.classList.contains("manual-image")) fields.image_src = input.value;
  else fields.overview = input.value;
  manualData[handle] = fields;
  if (picks[handle] !== "manual") {
    picks[handle] = "manual";
    const radio = card.querySelector('input[type="radio"][value="manual"]');
    if (radio) radio.checked = true;
  }
  saveCache();
  markDecided(handle);
  queueManualSave(handle);
});

render();
hydrateFromServer();
</script>
</body>
</html>
