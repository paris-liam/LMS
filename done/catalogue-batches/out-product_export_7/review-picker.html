.", "poster_path": ""}, {"id": 173077, "title": "Beyond Citizen Kane", "year": "1993", "overview": "Beyond Citizen Kane (1993) is a British documentary film directed by Simon Hartog, produced by John Ellis, and broadcast on Channel 4.  It details the dominant position of the Rede Globo media group in the Brazilian society, discussing the group's influence, power, and political connections. Globo's president and founder Roberto Marinho came in for particular criticism, being compared with fictional newspaper tycoon Charles Foster Kane, created by Orson Welles for the 1941 film Citizen Kane. According to the documentary, Marinho's media group engages in the same Kane wholesale manipulation of news to influence the public opinion.", "poster_path": "/mpgEvSwkxXkef5mcFDRTBZagoEL.jpg"}, {"id": 296021, "title": "The Complete 'Citizen Kane'", "year": "1991", "overview": "Documentary looking at Orson Welles and the production of the film CITIZEN KANE fifty years ago, considering the furore that accompanied it and the real life press baron William Randolph Hearst upon whom Kane is based, and his efforts to halt the film, destroy the negative and persecution of people involved with its production and showing. It includes BBC interviews with Welles made in 1960 and 1982, and film historian Robert Carringer looks at the scenes that never made it to the screen. American film critic Pauline Kael also analyses the film's enduring appeal. Extracts from \"The RKO Story\" (producer: Rosemary Wilton) and \"Yesterday's Whitness\" (producers: Christopher Cook and Stephen Peet).", "poster_path": "/kiZNwHsGGdcWpx1HOx7zN0UMqgT.jpg"}, {"id": 278484, "title": "The Battle Over Citizen Kane", "year": "1996", "overview": "Documentary about the battle between Orson Welles and William Randolph Hearst over Welles' Citizen Kane (1941). Features interviews with Welles' and Hearst's co-workers also acts as a relatively complete biograph of Hearst's career.", "poster_path": "/tPZ9EioXBZ8j8aUqVdBX3vD8uK });

document.getElementById("cards").addEventListener("change", event => {
  const input = event.target;
  if (input.type !== "radio") return;
  const handle = input.closest(".card").dataset.handle;
  if (input.value === "undecided") {
    delete picks[handle];
  } else {
    picks[handle] = input.value;
  }
  savePicks();
  input.closest(".card").classList.toggle("decided", picks[handle] !== undefined);
  updateCounter();
});

document.getElementById("cards").addEventListener("input", event => {
  const input = event.target;
  if (!input.classList.contains("manual-image") && !input.classList.contains("manual-overview")) return;
  const card = input.closest(".card");
  const handle = card.dataset.handle;
  const fields = manualData[handle] || {};
  if (input.classList.contains("manual-image")) fields.image_src = input.value;
  else fields.overview = input.value;
  manualData[handle] = fields;
  // Typing in a manual field selects that card's Manual option.
  if (picks[handle] !== "manual") {
    picks[handle] = "manual";
    const radio = card.querySelector('input[type="radio"][value="manual"]');
    if (radio) radio.checked = true;
    card.classList.add("decided");
    updateCounter();
  }
  savePicks();
});

document.getElementById("export").addEventListener("click", () => {
  const out = [];
  for (const product of PRODUCTS) {
    const pick = picks[product.handle];
    if (pick === undefined) continue;
    if (pick === "skip") {
      out.push({handle: product.handle, choice: "skip"});
    } else if (pick === "manual") {
      const fields = manualData[product.handle] || {};
      const image_src = (fields.image_src || "").trim();
      const overview = (fields.overview || "").trim();
      if (!image_src && !overview) continue; // nothing typed — skip
      out.push({handle: product.handle, choice: "manual", image_src, overview});
    } else {
      const candidate = product.candidates[Number(pick)];
      if (!candidate) continue;
      out.push({
        handle: product.handle,
        choice: "tmdb",
        poster_path: candidate.poster_path,
        overview: candidate.overview,
      });
    }
  }
  const blob = new Blob([JSON.stringify(out, null, 2)], {type: "application/json"});
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "tmdb-picks.json";
  link.click();
  URL.revokeObjectURL(link.href);
});

render();
</script>
</body>
</html>
