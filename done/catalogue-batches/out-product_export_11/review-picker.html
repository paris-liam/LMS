io's mould, with Westernised characters and trendy middle-class lifestyles. Yet, Chor's first film is not exempt from the social urgency that characterises the Cantonese cinema of his father, Cheung Wood-yau. The film cloaks its entertainment in a moral deliberation on blood ties, its story about the raising of a bastard child a head-on challenge of archaic family values. An ostentatious start for a colourful and eventful career.", "poster_path": "/tCqdVzoz12PPtdUik3wY4yBz68N.jpg"}, {"id": 360633, "title": "The Raw Natural", "year": "2012", "overview": "The Raw Natural documentary explores professional athletes reaching peak performance and untapped potential through raw food nutrition. The film highlights, Evan Strong, who regains his competitive edge in sports through raw food nutrition after a tragic accident that causes him to lose a leg and end his professional career in skateboarding. Evan's accident becomes the impetus for his change in diet to simple, healthy raw food nutrition. Evan is now the world champion in adaptive Snowboarding (Ranked # 1 at the XGames, World Cup, Nationals, etc) See how raw food nutrition has led to incredible new triumphs in the athletic careers of professional athletes in surfing, MMA fighting, tennis, baseball, snowboarding and more... This film also features renowned raw food chefs and leading health and nutrition experts, as well as top athletes and professional players who are also experiencing the benefits from raw food nutrition. What would you do to stay in the game?", "poster_path": ""}, {"id": 954931, "title": "The Natural Art", "year": "1969", "overview": "Legendary Bay Area surf photographer Fred Windisch's surf and psychedelia film from 1969: The Natural Art is an expression of the lifestyles, sports, art and surfing at the end of the 60s era. The film blends surfing footage with images of rock concerts in Golden Gate Park, yoga exercises and skiing with splashes of psychedelia thrown in. Fred\u2019s artistic sensibilities and intimate knowledge of surfing and the blossoming intellectual movement are brought together in somewhat of a period piece that does an excellent job of capturing the feeling of the time. Local Pedro Point surfer Dick Keating is featured in much of the surfing footage, where he captured performing innovative maneuvers that few have repeated since.", "poster_path": ""}]}, {"handle": "hawaiian-beach-party-vhs", "title": "Hawaiian Beach Party", "vendor": "VHS", "genre": "kids-family", "reason": "ambiguous match (best candidate: 'You're Invited to Mary-Kate and Ashley's Hawaiian Beach Party' (1996))", "candidates": [{"id": 500326, "title": "You're Invited to Mary-Kate and Ashley's Hawaiian Beach Party", "year": "1996", "overview": "Mary-Kate and Ashley go with their friends to Hawaii for a party.", "poster_path": "/mAsmaOJUY6wI5eEXixZ4aWMmo1S.jpg"}]}, {"handle": "padre-pio-dvd", "title": "Padre Pio", "vendor": "DVD", "genre": "drama", "reason": "ambiguous match (best candidate: 'Padre Pio' (2022))", "candidates": [{"id": 860901, "title": "Padre Pio", "year": "2022", "overview": "It is the end of World War I and the young Italian soldiers are making their way back to San Giovanni Rotondo, a land of poverty, with a tradition of violence and submission to the iron-clad rule of the church and its wealthy landowners. Families are desperate, the men are broken, albeit victorious. Padre Pio also arrives, at a remote Capuchin monastery, to begin his ministry, evoking an aura of charisma, saintliness and epic visions of Jesus, Mary and the Devil himself. The eve of the first free elections in Italy sets the stage for a massacre with a metaphorical dimension: an apocalyptic event that changes the course of history.", "poster_path": "/hRrCrLtbhIPelONxL8MEFif1JZC.jpg"}, {"id": 226782, "title": "Padre Pio", "year": "2006", "overview": "In a small village called Pietrelcina, in the middle of the mountains of southern Italy, lives young Francisco. After serving as a friar for many years, Francisco becomes a priest and begins his first mission.", "poster_path": "/7Gmk3co2ZnglcKID0NfKiNycF8H.jpg"}, {"id": 1137530, "title": "Padre Pio", "year": "1968", "overview": "BBC TV movie about the life of the late Francesco Forgione, widely known as Padre Pio.", "poster_path": "/A30FndqmDYakAFaqAMfh0sbOtT7.jpg"}, {"id": 893822, "title": "Padre Pio Sanctus", "year": "2003", "overview": "This is the definitive biography of the saint from Pietrelcina, Italy. With one hour of filmed material, much of which has never been seen before, this film introduces the faithful to every aspect of the life, spirituality, and work of this 20th century saint.", "poster_path": "/9Mby3mqFO6ahGj7SubZkptJqNUy.jpg"}, {"id": 851394, "title": "Morte di Padre Pio", "year": "1971", "overview": "This documentary takes its cue from the death of Padre Pio and from the atmosphere of intense popular mourning, so as to examine the birth and development of one of this century's most exceptional myths", "poster_path": "/rfsKGuslBlE9eKUwpRzMsT7KFR4.jpg"}]}, {"handle": "the-family-bluray", "title": "The Family", "vendor": "Blu-Ray", "genre": "drama", "reason": "ambiguous match (best candidate: 'The Family' (2013))", "candidates": [{"id": 874891, "title": "The Family", "year": "2023", "overview": "A young family, living in isolation and forced into hard labor out of fear of dishonoring their Father and Mother, fight to free themselves from their religious cult.", "poster_path": "/k3GU74oE7Yk1kFVO8FKfQgugzKy.jpg"}, {"id": 112205, "title": "The Family", "year": "2013", "overview": "After ratting out his Mafia cohorts, Giovanni Manzoni and his family enter the Witness Protection Program and relocate to a sleepy town in France. Despite the best efforts of their handler to keep them in line, Giovanni (now called Fred Blake), his wife and children can't help but resort to doing things the \"family\" way. However, their dependence on such old habits places everyone in danger from vengeful mobsters.", "poster_path": "/x2arN02JFsZcDKmBb0SIjG8Smc8.jpg"}, {"id": 231384, "title": "The Family", "year": "2011", "overview": "A family has a hard time tying to stay together, because murder seems to be in their blood, and a their favorite type of gathering is a massacre.", "poster_path": "/kOLnCx47fqImkjShGc1DBcY3QzK.jpg"}, {"id": 5994, "title": "The Family Man", "year": "2000", "overview": "Jack's lavish, fast-paced lifestyle changes one Christmas night when he stumbles into a grocery store holdup and disarms the gunman. The next morning he wakes up in bed lying next to Kate, his college sweetheart he left in order to pursue his career, and to the horrifying discovery that his former life no longer exists. As he stumbles through this alternate suburban universe, Jack finds himself at a crossroad where he must choose between his high-power career and the woman he loves.", "poster_path": "/9wToOVsKuf0XeKhlauzCa3D8Gui.jpg"}, {"id": 291264, "title": "The Family Fang", "year": "2016", "overview": "A brother and sister return to their family home in search of their world famous parents who have disappeared.", "poster_path": "/gVLOpMH3p8PpnbGa1UOGDr78xSS.jpg"}]}, {"handle": "lincoln-bluray", "title": "Lincoln", "vendor": "Blu-Ray", "genre": "drama", "reason": "ambiguous match (best candidate: 'Lincoln' (2012))", "candidates": [{"id": 72976, "title": "Lincoln", "year": "2012", "overview": "The revealing story of the 16th US President's tumultuous final months in office. In a nation divided by war and the strong winds of change, Lincoln pursues a course of action designed to end the war, unite the country and abolish slavery. With the moral courage and fierce determination to succeed, his choices during this critical moment will change the fate of generations to come.", "poster_path": "/7mUYEkv9W3ek61eetZCfMQYVoi.jpg"}, {"id": 1178589, "title": "Lincoln", "year": "2023", "overview": "", "poster_path": "/gqQRygzhBd8yclznULW1DB5BrDY.jpg"}, {"id": 340036, "title": "Lincoln", "y const BATCH_ID = "out-product_export_11";
const STORAGE_KEY = "tmdb-review-picks::" + BATCH_ID;
const MANUAL_KEY = "tmdb-review-manual::" + BATCH_ID;
const HIDE_DECIDED_KEY = "tmdb-review-hide-decided::" + BATCH_ID;
// Pre-namespacing pages all wrote to this one shared key. Migrate any
// entries for this batch's own handles into the namespaced key below,
// so picks made before this page was regenerated aren't lost.
const LEGACY_STORAGE_KEY = "tmdb-review-picks";
const LEGACY_MANUAL_KEY = "tmdb-review-manual";

function loadStored(key) {
  try { return JSON.parse(localStorage.getItem(key)) || {}; }
  catch (e) { return {}; }
}
let picks = loadStored(STORAGE_KEY);
let manualData = loadStored(MANUAL_KEY);

// One-time migration: pull this batch's own handles out of the old shared
// key, so picks made before namespacing existed aren't lost or, worse,
// don't leak other batches' decided counts into this page's counter.
(function migrateLegacyPicks() {
  const handles = new Set(PRODUCTS.map(p => p.handle));
  const legacyPicks = loadStored(LEGACY_STORAGE_KEY);
  const legacyManual = loadStored(LEGACY_MANUAL_KEY);
  let changed = false;
  for (const handle of Object.keys(legacyPicks)) {
    if (handles.has(handle) && !(handle in picks)) {
      picks[handle] = legacyPicks[handle];
      changed = true;
    }
  }
  for (const handle of Object.keys(legacyManual)) {
    if (handles.has(handle) && !(handle in manualData)) {
      manualData[handle] = legacyManual[handle];
      changed = true;
    }
  }
  if (changed) savePicks();
})();

function savePicks() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(picks));
  localStorage.setItem(MANUAL_KEY, JSON.stringify(manualData));
}

function esc(text) {
  const div = document.createElement("div");
  div.textContent = text || "";
  return div.innerHTML;
}

function optionHtml(handle, value, checked, extraClass, inner) {
  return `<label class="option ${extraClass}">
    <input type="radio" name="pick-${esc(handle)}" value="${value}" ${checked ? "checked" : ""}>
    ${inner}
  </label>`;
}

function render() {
  const cards = document.getElementById("cards");
  cards.innerHTML = PRODUCTS.map(product => {
    const current = picks[product.handle];
    const searchUrl = "https://www.themoviedb.org/search?query=" + encodeURIComponent(product.title);
    const googleUrl = "https://www.google.com/search?q=" + encodeURIComponent(product.title + " movie");
    const options = product.candidates.map((candidate, i) => {
      const poster = candidate.poster_path
        ? `<img src="https://image.tmdb.org/t/p/w185${esc(candidate.poster_path)}" alt="" loading="lazy">`
        : '<div class="no-poster">no poster</div>';
      const overview = candidate.overview ? esc(candidate.overview) : "<em>(no overview)</em>";
      return optionHtml(product.handle, String(i), current === String(i), "",
        `${poster}<span class="info"><strong>${esc(candidate.title)}</strong> (${esc(candidate.year) || "?"})<br>${overview}</span>`);
    }).join("");
    const tags = [product.vendor, product.genre].filter(Boolean);
    const tagsHtml = tags.length
      ? `<span class="tags">${tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</span>`
      : "";
    return `<section class="card ${current !== undefined ? "decided" : ""}" data-handle="${esc(product.handle)}">
      <h2>${esc(product.title)} ${tagsHtml}</h2>
      <div class="meta"><code>${esc(product.handle)}</code> — ${esc(product.reason)}
        · <a href="${searchUrl}" target="_blank">TMDB search</a>
        · <a href="${googleUrl}" target="_blank">Google</a></div>
      <div class="candidates">
        ${options}
        ${optionHtml(product.handle, "manual", current === "manual", "special",
          `<span class="info" style="flex:1"><strong>Manual entry</strong> — fill in what you found
            <span class="manual-fields">
              <input type="url" class="manual-image" placeholder="Image URL (leave blank to keep current)"
                     value="${esc((manualData[product.handle] || {}).image_src || "")}">
              <textarea class="manual-overview" placeholder="Description (leave blank to keep current)">${esc((manualData[product.handle] || {}).overview || "")}</textarea>
            </span>
          </span>`)}
        ${optionHtml(product.handle, "skip", current === "skip", "special",
          '<span class="info"><strong>Skip this one</strong> — leave it for a later pass</span>')}
        ${optionHtml(product.handle, "undecided", current === undefined, "",
          '<span class="info">Decide later</span>')}
      </div>
    </section>`;
  }).join("");
  updateCounter();
}

function updateCounter() {
  const decided = Object.keys(picks).length;
  document.getElementById("counter").textContent = `${decided} / ${PRODUCTS.length} decided`;
}

const hideDecidedBox = document.getElementById("hide-decided");
hideDecidedBox.checked = localStorage.getItem(HIDE_DECIDED_KEY) === "1";
document.body.classList.toggle("hide-decided", hideDecidedBox.checked);
hideDecidedBox.addEventListener("change", () => {
  document.body.classList.toggle("hide-decided", hideDecidedBox.checked);
  localStorage.setItem(HIDE_DECIDED_KEY, hideDecidedBox.checked ? "1" : "0");
});

document.getElementById("cards").addEventListener("change", event => {
  const input = event.target;
  if (input.type !== "radio") return;
  const handle = input.closest(".card").dataset.handle;
  if (input.value === "undecided") {
    delete picks[handle];
  } else {
    picks[handle] = input.value;
  }
  savePicks();
  input.closest(".card").classList.toggle("decided", picks[handle] !== undefined);
  updateCounter();
});

document.getElementById("cards").addEventListener("input", event => {
  const input = event.target;
  if (!input.classList.contains("manual-image") && !input.classList.contains("manual-overview")) return;
  const card = input.closest(".card");
  const handle = card.dataset.handle;
  const fields = manualData[handle] || {};
  if (input.classList.contains("manual-image")) fields.image_src = input.value;
  else fields.overview = input.value;
  manualData[handle] = fields;
  // Typing in a manual field selects that card's Manual option.
  if (picks[handle] !== "manual") {
    picks[handle] = "manual";
    const radio = card.querySelector('input[type="radio"][value="manual"]');
    if (radio) radio.checked = true;
    card.classList.add("decided");
    updateCounter();
  }
  savePicks();
});

document.getElementById("export").addEventListener("click", () => {
  const out = [];
  for (const product of PRODUCTS) {
    const pick = picks[product.handle];
    if (pick === undefined) continue;
    if (pick === "skip") {
      out.push({handle: product.handle, choice: "skip"});
    } else if (pick === "manual") {
      const fields = manualData[product.handle] || {};
      const image_src = (fields.image_src || "").trim();
      const overview = (fields.overview || "").trim();
      if (!image_src && !overview) continue; // nothing typed — skip
      out.push({handle: product.handle, choice: "manual", image_src, overview});
    } else {
      const candidate = product.candidates[Number(pick)];
      if (!candidate) continue;
      out.push({
        handle: product.handle,
        choice: "tmdb",
        poster_path: candidate.poster_path,
        overview: candidate.overview,
      });
    }
  }
  const blob = new Blob([JSON.stringify(out, null, 2)], {type: "application/json"});
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "tmdb-picks.json";
  link.click();
  URL.revokeObjectURL(link.href);
});

render();
</script>
