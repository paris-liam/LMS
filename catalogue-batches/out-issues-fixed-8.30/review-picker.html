<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Movie review picker — 7 products</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; margin: 2rem auto; max-width: 1080px; padding: 0 1rem; background: #fafafa; color: #222; }
  header { position: sticky; top: 0; background: #fafafa; padding: .75rem 0; border-bottom: 1px solid #ddd; z-index: 10; display: flex; align-items: center; gap: 1rem; }
  header h1 { font-size: 1.1rem; margin: 0; flex: 1; }
  #counter { color: #666; font-size: .9rem; }
  #export { background: #973123; color: #fff; border: 0; border-radius: 6px; padding: .5rem 1rem; font-size: .9rem; cursor: pointer; }
  #hide-decided-label { font-size: .9rem; color: #444; display: flex; align-items: center; gap: .35rem; cursor: pointer; }
  .card { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 1rem 1.5rem; margin: 1.5rem 0; }
  .card.decided { border-color: #5f8d7a; background: #f4faf7; }
  body.hide-decided .card.decided { display: none; }
  .card h2 { font-size: 1.05rem; margin: 0 0 .15rem; display: flex; align-items: center; gap: .4rem; flex-wrap: wrap; }
  .tags { display: inline-flex; gap: .3rem; }
  .tag { font-size: .7rem; font-weight: 500; text-transform: uppercase; letter-spacing: .02em; color: #5f8d7a; background: #eef5f1; border-radius: 3px; padding: .1rem .4rem; }
  .card .meta { font-size: .8rem; color: #888; margin-bottom: .75rem; }
  .card .meta a { color: #973123; }
  .candidates { display: flex; flex-direction: column; gap: .5rem; }
  label.option { display: flex; gap: .75rem; align-items: flex-start; border: 1px solid #eee; border-radius: 6px; padding: .5rem .75rem; cursor: pointer; }
  label.option:hover { background: #f5f5f5; }
  label.option input { margin-top: .3rem; }
  label.option img { width: 60px; height: auto; border-radius: 3px; flex-shrink: 0; }
  label.option .no-poster { width: 60px; height: 90px; background: #eee; color: #999; font-size: .65rem; display: flex; align-items: center; justify-content: center; border-radius: 3px; flex-shrink: 0; }
  label.option .info { font-size: .85rem; line-height: 1.4; }
  label.option .info strong { font-size: .9rem; }
  label.option.special { background: #fdf6f5; }
  .manual-fields { display: flex; flex-direction: column; gap: .4rem; margin: .25rem 0 0 2rem; }
  .manual-fields input, .manual-fields textarea { font: inherit; font-size: .85rem; border: 1px solid #ccc; border-radius: 4px; padding: .4rem .5rem; width: 100%; box-sizing: border-box; }
  .manual-fields textarea { min-height: 4.5em; resize: vertical; }
</style>
</head>
<body>
<header>
  <h1>Movie review picker</h1>
  <span id="counter"></span>
  <label id="hide-decided-label"><input type="checkbox" id="hide-decided"> Hide decided</label>
  <button id="export">Export picks (tmdb-picks.json)</button>
</header>
<main id="cards"></main>
<script>
const PRODUCTS = [{"handle": "deja-vu", "title": "Deja Vu", "vendor": "VHS", "genre": "thriller", "reason": "ambiguous match (best candidate: 'Deja Vu' (1999))", "candidates": [{"id": 7551, "title": "D\u00e9j\u00e0 Vu", "year": "2006", "overview": "Called in to recover evidence in the aftermath of a horrific explosion on a New Orleans ferry, Federal agent Doug Carlin gets pulled away from the scene and taken to a top-secret government lab that uses a time-shifting surveillance device to help prevent crime.", "poster_path": "/eTX6hklzFOiEVqVukNCEedZKhix.jpg"}, {"id": 438185, "title": "Deja Vu", "year": "1999", "overview": "Psychological drama revolving around a couple caught in a living nightmare after the death of their young son in a car crash.", "poster_path": "/anhkLaFfPAg9rwnFLNTCIl5nyPe.jpg"}, {"id": 1418322, "title": "D\u00e9j\u00e0 Vu", "year": "1987", "overview": "Award-winning short thesis film by Jorge Hoogland. Premise unknown.", "poster_path": ""}, {"id": 527215, "title": "Deja Vu", "year": "2018", "overview": "Jimin has killed a girl in a car accident when she was driving with her fiance Woojin. From that night, she experiences terrifying hallucination seeing the dead girl. Unable to bear it, she finally goes to the police to report the truth, only to find that she didn\u2019t actually have a car accident.", "poster_path": "/tetvwfnEkTJZ0t2efc808NmxuFN.jpg"}, {"id": 72955, "title": "D\u00e9j\u00e0 vu", "year": "1990", "overview": "After Mick Nich, a 1930's Chicago gangster, sells out his own gang to the police, the Mafia hires the best hitman in town, Johnny Pollack, to follow him to Odessa, USSR. Upon arrival, Pollack loses his memory and goes on various adventures with a group of thick-headed Odessa locals who think he is a harmless butterfly collector.", "poster_path": "/wZ8UYRvIeVjC9GjxBMERWvzpt4a.jpg"}]}, {"handle": "look-who-s-talking", "title": "Look Who\u2019s Talking", "vendor": "VHS", "genre": "comedy", "reason": "ambiguous match (best candidate: 'Look Who's Talking' (1989))", "candidates": [{"id": 9494, "title": "Look Who's Talking", "year": "1989", "overview": "After a single, career-minded woman is left on her own to give birth to the child of a married man, she finds a new romantic chance in a cab driver. Meanwhile, the point-of-view of the newborn baby is narrated through voice-over.", "poster_path": "/uVM0D7Q6U9H6xMSZmMdfwECih5h.jpg"}, {"id": 9356, "title": "Look Who's Talking Too", "year": "1990", "overview": "Mollie and James are together and raising a family, which now consists of an older Mikey and his baby sister, Julie. Tension between the siblings arises, and as well with Mollie and James when Mollie's brother Stuart moves in. Mikey is also learning how to use the toilet for the first time.", "poster_path": "/m409mVHmvDOZJltNzHJYigUthsW.jpg"}, {"id": 11982, "title": "Look Who's Talking Now!", "year": "1993", "overview": "When high-powered executive Samantha LeBon hatches a scheme to spend a romantic Christmas with her new employee \u2013 the unsuspecting, blithesome James \u2013 his wife, their kids and their two dogs, Rocks and Daphne, must rescue him before he makes a terrible mistake.", "poster_path": "/73JahFiizkMVsrrslXInmNK54nC.jpg"}, {"id": 806667, "title": "Parrots: Look Who's Talking", "year": "1995", "overview": "A look at parrots, birds with a playful nature and remarkable mimicry skills that have endeared them to pet owners worldwide. Included: the largest parrot species, the hyacinth macaw; scarlet macaws, white cockatoos and monk parakeets.", "poster_path": "/ibXEkszGqhmlnpL8Grg0hUrFPDh.jpg"}, {"id": 531077, "title": "Dr. Alban: Look Who's Talking! - The Video... And More", "year": "1994", "overview": "The complete selection of Dr. Alban videos, plus live performance and exclusive interview footage.", "poster_path": "/Iyk9SZgG2c3AmLRRSPWyvSRk8p.jpg"}]}, {"handle": "celebrity-vhs-floor-sale", "title": "Celebrity", "vendor": "VHS", "genre": "comedy", "reason": "ambiguous match (b }, {"handle": "cherish-vhs-floor-sale", "title": "Cherish", "vendor": "VHS", "genre": "comedy", "reason": "ambiguous match (best candidate: 'Cherish' (2002))", "candidates": [{"id": 18408, "title": "Cherish", "year": "2002", "overview": "After a martini-induced rampage, a fantasy-prone young woman is placed under house arrest.", "poster_path": "/hTNAKGnqi8v4FRPEjm9Wl5S5yMz.jpg"}, {"id": 1741989, "title": "Cherish", "year": "2026", "overview": "A woman comes to terms with what has been taken from her due to her old age.", "poster_path": "/1fLMTQ5Pb5B75xAeTsgOi57AmzL.jpg"}, {"id": 717489, "title": "Cherish", "year": "2018", "overview": "In the rural south, a Black boy tries to fly.", "poster_path": "/qqZvPIPGinF4vBLMNIozL2XwjZV.jpg"}, {"id": 315696, "title": "Cherish", "year": "1998", "overview": "A gay man has lost his lover to a fatal illness and is trying to go on with his life. If only his preparations for a night of dancing weren't constantly reminding him of the one that he lost.", "poster_path": "/1gdTaueD7TkG3botY6JyV8rWz9j.jpg"}, {"id": 1460836, "title": "Cherish", "year": "", "overview": "\"Cherish\" by Hitotsuyanagi-tai is a CD+Blu-ray releas", "poster_path": "/rq3pL3hws2eHnQfoUSxQauoNYOe.jpg"}]}, {"handle": "speed-vhs-floor-sale", "title": "Speed", "vendor": "VHS", "genre": "action", "reason": "ambiguous match (best candidate: 'Speed' (1994))", "candidates": [{"id": 1637, "title": "Speed", "year": "1994", "overview": "Tensions run high when a crazed bomber rigs a Los Angeles bus with a device that will kill everyone on board if the vehicle's speed dips below fifty miles per hour.", "poster_path": "/82PkCE4R95KhHICUDF7G4Ly2z3l.jpg"}, {"id": 7459, "title": "Speed Racer", "year": "2008", "overview": "Speed Racer is a young and brilliant racing driver. When corruption in the racing leagues costs his brother his life, Speed must team up with the police and the mysterious Racer X to bring an end to the corruption and criminal activities.", "poster_path": "/rVNpkV6ksY1hqjkun1WCTxqyK9v.jpg"}, {"id": 136797, "title": "Need for Speed", "year": "2014", "overview": "The film revolves around a local street-racer who partners with a rich and arrogant business associate, only to find himself framed by his colleague and sent to prison. After he gets out, he joins a New York-to-Los Angeles race to get revenge. But when the ex-partner learns of the scheme, he puts a massive bounty on the racer's head, forcing him to run a cross-country gauntlet of illegal racers in all manner of supercharged vehicles.", "poster_path": "/4ktdbrhCnAoDGLW36afjB717Sa.jpg"}, {"id": 1473878, "title": "Speed Demon", "year": "2026", "overview": "Aboard a high-speed train, a nun who has lost her faith must perform her first exorcism on a possessed passenger hellbent on crashing the runaway train.", "poster_path": "/gP7maqMVoQPXYi1rtCJ1kpSpNTA.jpg"}, {"id": 177937, "title": "Speed", "year": "1936", "overview": "Terry is the chief car tester for Emery Motors and Frank is an Engineer. Jane has just been hired to work in publicity. Frank and Terry both want Jane to be their girl. Terry has designed a new carburetor that should bring him fame and money, but he cannot get it to work correctly. Terry and Gadget have tested it for over a year, but it still is not perfected. Emery Motors assigns Frank to help Terry with the carburetor, but Terry is not happy because Frank is an Engineer and is also vying for Jane. They finish the carburetor, and to test it, they enter a car in the Indianapolis 500 race. Terry is not yet satisfied with the carburetor before the big race even though it has passed all the tests.", "poster_path": "/n22vSjDCcD0nr1vJcZh2ILYqtge.jpg"}]}, {"handle": "the-fly-vhs-floor-sale", "title": "The Fly", "vendor": "VHS", "genre": "horror", "reason": "ambiguous match (best candidate: 'The Fly' (1986))", "candidates": [{"id": 9426, "title": "The Fly", "year": "1986", "overview": "When brilliant, eccentric scientist Seth Brundle makes a huge technological breakthrough in teleportation, he decides to test it on himself. Unbeknownst to him, a common housefly manages to get inside the device and the two become one.", "poster_path": "/8gZWMhJHRvaXdXsNhERtqNHYpH3.jpg"}, {"id": 11815, "title": "The Fly", "year": "1958", "overview": "Industrialist Fran\u00e7ois Delambre is called late at night by his sister-in-law, Helene, who tells him that she has just killed her husband. Reluctant at first, she eventually explains to the police that he invented a matter transportation apparatus and, while experimenting on himself, a fly entered the chamber.", "poster_path": "/kXdBcDh2EbgSIf4Oo1dxKapZM2f.jpg"}, {"id": 956842, "title": "Fly Me to the Moon", "year": "2024", "overview": "Sparks fly in all directions as marketing maven Kelly Jones, brought in to fix NASA's public image, wreaks havoc on Apollo 11 launch director Cole Davis' already difficult task of putting a man on the moon. When the White House deems the mission too important to fail, Jones is directed to stage a fake moon landing as backup, and the countdown truly begins.", "poster_path": "/gjk8YdXpItoC1in53FCrZMFIuBx.jpg"}, {"id": 10344, "title": "The Fly II", "year": "1989", "overview": "Martin Brundle, born of the human/fly, is adopted by his father's place of employment (Bartok Inc.) while the employees simply wait for his mutant chromosomes to come out of their dormant state.", "poster_path": "/gORksEPahEgO409HYJOZlNVyEpe.jpg"}, {"id": 51533, "title": "Let the Bullets Fly", "year": "2010", "overview": "When circumstances force an outlaw to impersonate a county governor and clean up a corrupt town, the Robin Hood figure finds himself in a showdown with the local godfather.", "poster_path": "/pkwBO3XkQLhgb31vl5ZwmGC5meT.jpg"}]}, {"handle": "arachnophobia-vhs-rentla-horror", "title": "Arachnophobia", "vendor": "VHS", "genre": "horror", "reason": "ambiguous match (best candidate: 'Arachnophobia' (1990))", "candidates": [{"id": 6488, "title": "Arachnophobia", "year": "1990", "overview": "A large spider from the jungles of South America is accidentally transported in a crate with a dead body to America where it mates with a local spider. Soon after, the residents of a small California town disappear as the result of spider bites from the deadly spider offspring. It's up to a couple of doctors with the help of an insect exterminator to annihilate these eight legged freaks.", "poster_path": "/lHjpwv1Yv2RcGcTQb4Lc1cKw1y9.jpg"}, {"id": 1475721, "title": "Arachnophobia", "year": "2025", "overview": "A seemingly harmless prank turns into a delirious nightmare revolving around spiders.", "poster_path": "/q2y6dPmusN81oKa5WVa6EV0fKHq.jpg"}, {"id": 830033, "title": "Arachnophobia", "year": "2017", "overview": "After Ella watches a nature documentary about black widow spiders, she makes a connection between the cannibalistic spider species that eats the male after mating and the mysterious new woman in the house, whom her father has invited to a date that evening.", "poster_path": "/pxReJVLppTDAfb5ABALOG85fgXq.jpg"}, {"id": 1290296, "title": "Thrills, Chills & Spiders: The Making of Arachnophobia", "year": "1990", "overview": "A behind-the-scenes look at the making of Arachnophobia, hosted by Mark Taylor.", "poster_path": ""}]}];
const BATCH_ID = "out-issues-fixed-8.30";
const STORAGE_KEY = "tmdb-review-picks::" + BATCH_ID;
const MANUAL_KEY = "tmdb-review-manual::" + BATCH_ID;
const HIDE_DECIDED_KEY = "tmdb-review-hide-decided::" + BATCH_ID;
// Pre-namespacing pages all wrote to this one shared key. Migrate any
// entries for this batch's own handles into the namespaced key below,
// so picks made before this page was regenerated aren't lost.
const LEGACY_STORAGE_KEY = "tmdb-review-picks";
const LEGACY_MANUAL_KEY = "tmdb-review-manual";

function loadStored(key) {
  try { return JSON.parse(localStorage.getItem(key)) || {}; }
  catch (e) { return {}; }
}
let picks = loadStored(STORAGE_KEY);
let manualData = loadStored(MANUAL_KEY);

// One-time migration: pull this batch's own handles out of the old shared
// key, so picks made before namespacing existed aren't lost or, worse,
// don't leak other batches' decided counts into this page's counter.
(function migrateLegacyPicks() {
  const handles = new Set(PRODUCTS.map(p => p.handle));
  const legacyPicks = loadStored(LEGACY_STORAGE_KEY);
  const legacyManual = loadStored(LEGACY_MANUAL_KEY);
  let changed = false;
  for (const handle of Object.keys(legacyPicks)) {
    if (handles.has(handle) && !(handle in picks)) {
      picks[handle] = legacyPicks[handle];
      changed = true;
    }
  }
  for (const handle of Object.keys(legacyManual)) {
    if (handles.has(handle) && !(handle in manualData)) {
      manualData[handle] = legacyManual[handle];
      changed = true;
    }
  }
  if (changed) savePicks();
})();

function savePicks() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(picks));
  localStorage.setItem(MANUAL_KEY, JSON.stringify(manualData));
}

function esc(text) {
  const div = document.createElement("div");
  div.textContent = text || "";
  return div.innerHTML;
}

function optionHtml(handle, value, checked, extraClass, inner) {
  return `<label class="option ${extraClass}">
    <input type="radio" name="pick-${esc(handle)}" value="${value}" ${checked ? "checked" : ""}>
    ${inner}
  </label>`;
}

function render() {
  const cards = document.getElementById("cards");
  cards.innerHTML = PRODUCTS.map(product => {
    const current = picks[product.handle];
    const searchUrl = "https://www.themoviedb.org/search?query=" + encodeURIComponent(product.title);
    const googleUrl = "https://www.google.com/search?q=" + encodeURIComponent(product.title + " movie");
    const options = product.candidates.map((candidate, i) => {
      const poster = candidate.poster_path
        ? `<img src="https://image.tmdb.org/t/p/w185${esc(candidate.poster_path)}" alt="" loading="lazy">`
        : '<div class="no-poster">no poster</div>';
      const overview = candidate.overview ? esc(candidate.overview) : "<em>(no overview)</em>";
      return optionHtml(product.handle, String(i), current === String(i), "",
        `${poster}<span class="info"><strong>${esc(candidate.title)}</strong> (${esc(candidate.year) || "?"})<br>${overview}</span>`);
    }).join("");
    const tags = [product.vendor, product.genre].filter(Boolean);
    const tagsHtml = tags.length
      ? `<span class="tags">${tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</span>`
      : "";
    return `<section class="card ${current !== undefined ? "decided" : ""}" data-handle="${esc(product.handle)}">
      <h2>${esc(product.title)} ${tagsHtml}</h2>
      <div class="meta"><code>${esc(product.handle)}</code> — ${esc(product.reason)}
        · <a href="${searchUrl}" target="_blank">TMDB search</a>
        · <a href="${googleUrl}" target="_blank">Google</a></div>
      <div class="candidates">
        ${options}
        ${optionHtml(product.handle, "manual", current === "manual", "special",
          `<span class="info" style="flex:1"><strong>Manual entry</strong> — fill in what you found
            <span class="manual-fields">
              <input type="url" class="manual-image" placeholder="Image URL (leave blank to keep current)"
                     value="${esc((manualData[product.handle] || {}).image_src || "")}">
              <textarea class="manual-overview" placeholder="Description (leave blank to keep current)">${esc((manualData[product.handle] || {}).overview || "")}</textarea>
            </span>
          </span>`)}
        ${optionHtml(product.handle, "skip", current === "skip", "special",
          '<span class="info"><strong>Skip this one</strong> — leave it for a later pass</span>')}
        ${optionHtml(product.handle, "undecided", current === undefined, "",
          '<span class="info">Decide later</span>')}
      </div>
    </section>`;
  }).join("");
  updateCounter();
}

function updateCounter() {
  const decided = Object.keys(picks).length;
  document.getElementById("counter").textContent = `${decided} / ${PRODUCTS.length} decided`;
}

const hideDecidedBox = document.getElementById("hide-decided");
hideDecidedBox.checked = localStorage.getItem(HIDE_DECIDED_KEY) === "1";
document.body.classList.toggle("hide-decided", hideDecidedBox.checked);
hideDecidedBox.addEventListener("change", () => {
  document.body.classList.toggle("hide-decided", hideDecidedBox.checked);
  localStorage.setItem(HIDE_DECIDED_KEY, hideDecidedBox.checked ? "1" : "0");
});

document.getElementById("cards").addEventListener("change", event => {
  const input = event.target;
  if (input.type !== "radio") return;
  const handle = input.closest(".card").dataset.handle;
  if (input.value === "undecided") {
    delete picks[handle];
  } else {
    picks[handle] = input.value;
  }
  savePicks();
  input.closest(".card").classList.toggle("decided", picks[handle] !== undefined);
  updateCounter();
});

document.getElementById("cards").addEventListener("input", event => {
  const input = event.target;
  if (!input.classList.contains("manual-image") && !input.classList.contains("manual-overview")) return;
  const card = input.closest(".card");
  const handle = card.dataset.handle;
  const fields = manualData[handle] || {};
  if (input.classList.contains("manual-image")) fields.image_src = input.value;
  else fields.overview = input.value;
  manualData[handle] = fields;
  // Typing in a manual field selects that card's Manual option.
  if (picks[handle] !== "manual") {
    picks[handle] = "manual";
    const radio = card.querySelector('input[type="radio"][value="manual"]');
    if (radio) radio.checked = true;
    card.classList.add("decided");
    updateCounter();
  }
  savePicks();
});

document.getElementById("export").addEventListener("click", () => {
  const out = [];
  for (const product of PRODUCTS) {
    const pick = picks[product.handle];
    if (pick === undefined) continue;
    if (pick === "skip") {
      out.push({handle: product.handle, choice: "skip"});
    } else if (pick === "manual") {
      const fields = manualData[product.handle] || {};
      const image_src = (fields.image_src || "").trim();
      const overview = (fields.overview || "").trim();
      if (!image_src && !overview) continue; // nothing typed — skip
      out.push({handle: product.handle, choice: "manual", image_src, overview});
    } else {
      const candidate = product.candidates[Number(pick)];
      if (!candidate) continue;
      out.push({
        handle: product.handle,
        choice: "tmdb",
        poster_path: candidate.poster_path,
        overview: candidate.overview,
      });
    }
  }
  const blob = new Blob([JSON.stringify(out, null, 2)], {type: "application/json"});
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "tmdb-picks.json";
  link.click();
  URL.revokeObjectURL(link.href);
});

render();
</script>
</body>
</html>
