<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Movie review picker — 4 products</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; margin: 2rem auto; max-width: 1080px; padding: 0 1rem; background: #fafafa; color: #222; }
  header { position: sticky; top: 0; background: #fafafa; padding: .75rem 0; border-bottom: 1px solid #ddd; z-index: 10; display: flex; align-items: center; gap: 1rem; }
  header h1 { font-size: 1.1rem; margin: 0; flex: 1; }
  #counter { color: #666; font-size: .9rem; }
  #export { background: #973123; color: #fff; border: 0; border-radius: 6px; padding: .5rem 1rem; font-size: .9rem; cursor: pointer; }
  #hide-decided-label { font-size: .9rem; color: #444; display: flex; align-items: center; gap: .35rem; cursor: pointer; }
  .card { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 1rem 1.5rem; margin: 1.5rem 0; }
  .card.decided { border-color: #5f8d7a; background: #f4faf7; }
  body.hide-decided .card.decided { display: none; }
  .card h2 { font-size: 1.05rem; margin: 0 0 .15rem; display: flex; align-items: center; gap: .4rem; flex-wrap: wrap; }
  .tags { display: inline-flex; gap: .3rem; }
  .tag { font-size: .7rem; font-weight: 500; text-transform: uppercase; letter-spacing: .02em; color: #5f8d7a; background: #eef5f1; border-radius: 3px; padding: .1rem .4rem; }
  .card .meta { font-size: .8rem; color: #888; margin-bottom: .75rem; }
  .card .meta a { color: #973123; }
  .candidates { display: flex; flex-direction: column; gap: .5rem; }
  label.option { display: flex; gap: .75rem; align-items: flex-start; border: 1px solid #eee; border-radius: 6px; padding: .5rem .75rem; cursor: pointer; }
  label.option:hover { background: #f5f5f5; }
  label.option input { margin-top: .3rem; }
  label.option img { width: 60px; height: auto; border-radius: 3px; flex-shrink: 0; }
  label.option .no-poster { width: 60px; height: 90px; background: #eee; color: #999; font-size: .65rem; display: flex; align-items: center; justify-content: center; border-radius: 3px; flex-shrink: 0; }
  label.option .info { font-size: .85rem; line-height: 1.4; }
  label.option .info strong { font-size: .9rem; }
  label.option.special { background: #fdf6f5; }
  .manual-fields { display: flex; flex-direction: column; gap: .4rem; margin: .25rem 0 0 2rem; }
  .manual-fields input, .manual-fields textarea { font: inherit; font-size: .85rem; border: 1px solid #ccc; border-radius: 4px; padding: .4rem .5rem; width: 100%; box-sizing: border-box; }
  .manual-fields textarea { min-height: 4.5em; resize: vertical; }
</style>
</head>
<body>
<header>
  <h1>Movie review picker</h1>
  <span id="counter"></span>
  <label id="hide-decided-label"><input type="checkbox" id="hide-decided"> Hide decided</label>
  <button id="export">Export picks (tmdb-picks.json)</button>
</header>
<main id="cards"></main>
<script>
const PRODUCTS = [{"handle": "blind-trust-pouvoir-intime", "title": "Blind Trust, Pouvoir Intime", "vendor": "Little Movie Store", "genre": "foreign", "reason": "ambiguous match (best candidate: 'Blind Trust' (1986))", "candidates": [{"id": 163533, "title": "Blind Trust", "year": "1986", "overview": "A government ministry's fast-rising head of security asks a shadowy fixer, Meursault, to steal a bag from an armored truck. Meursault goes to Th\u00e9o, a former night club owner, in prison for two years on false charges, who's being released in exchange for information about Montreal's underworld. Th\u00e9o agrees to steal the bag for money and safe passage to the US for himself and his son Robin. Th\u00e9o brings in two helpers, Gilder, ex-con and set designer, and Roxanne, Gilder's friend, a tough-minded petty thief. Their elaborate plan blows up when a guard, Marcel, takes his responsibilities too seriously. What happens to father and son? Will any of the thieves escape?", "poster_path": "/8q4X8s4m3dw5MAd6fZqmAoqZjXz.jpg"}]}, {"handle": "blind-side", "title": "Blind Side", "vendor": "Little Movie Store", "genre": "thriller", "reason": "ambiguous match (best candidate: 'Blind Side' (1993))", "candidates": [{"id": 22881, "title": "The Blind Side", "year": "2009", "overview": "The story of Michael Oher, a homeless and traumatized boy who became an All American football player and first round NFL draft pick with the help of a caring woman and her family.", "poster_path": "/PhpAdRopu0sOWf0BY7vVtxrRD3.jpg"}, {"id": 60505, "title": "Blind Side", "year": "1993", "overview": "A couple visits Mexico to scout a new location for their furniture manufacturing business, and hit a cop with their car on the way back stateside. Realizing that if they report it they could land in a Mexican jail (guilty until proven innocent), they clean up the car and return home. A few days later, an insistent man shows up wanting a job -- and insinuating that he saw something in Mexico that he would not want to report -- the couple must make a decision about how far they will allow themselves to be blackmailed.", "poster_path": "/fx6Ex4wtLCzH18BzNP6QT7LSjVQ.jpg"}, {"id": 80790, "title": "Blindside", "year": "2008", "overview": "A young playboy beds his sexy officemate, only to discover she has an equally delectable younger sister. The catch: little sis just recently lost her sight (and her boyfriend) in a car crash. The upside: she walks around in the nude thinking she's all alone in the house with big sis", "poster_path": "/8glP96gX4lYst2TnlRGfZlxxCRs.jpg"}, {"id": 795628, "title": "Blind Guardian - Imaginations From The Other Side - Live In Oberhausen", "year": "2020", "overview": "Live at Turbinenhalle, Oberhausen, Germany, December 3, 2016  1. Imaginations from the Other Side 8:26  2. I\u2019m Alive 5:40  3. A Past and Future Secret 4:13  4. The Script for My Requiem 6:32  5. Mordred\u2019s Song 5:20  6. Born in a Mourning Hall 5:37  7. Bright Eyes 5:41  8. Another Holy War 5:02  9. And the Story Ends 7:18", "poster_path": "/v4Hvw8stiwPZDwhbYrvlVFdj4N.jpg"}, {"id": 1477066, "title": "BLIND SIDES", "year": "", "overview": "Tj, accused of being an accomplice to her brother, has her memories investigated by two lawyers to prove her innocence.", "poster_path": "/n4j0TWVz9sD1JvAetBP8BTIsEMW.jpg"}]}, {"handle": "meteor", "title": "Meteor", "vendor": "Little Movie Store", "genre": "sci-fi", "reason": "ambiguous match (best candidate: 'Meteor' (1979))", "candidates": [{"id": 40160, "title": "Meteor", "year": "1979", "overview": "After a collision with a comet, a nearly 8km wide piece of the asteroid \"Orpheus\" is heading towards Earth. If it hits, it will cause an incredible catastrophe that will probably extinguish mankind. To stop the meteor, NASA wants to use the illegal nuclear weapon satellite \"Hercules,\" but discovers soon that it doesn't have enough firepower. Their only chance to save the world is to join forces with the USSR, which has also launched such an illegal satellite. But will both governments agree?", "poster_path": "/xMUuS1KFHRTFSf3PAY2tsbBdqkL.jpg"}, {"id": 870404, "title": "Meteor", "year": "2021", "overview": "After a meteor collides into Earth, a lonely rancher and a lost young girl are on the run from vicious mercenaries.", "poster_path": "/lPMRohZcjZhywbIUmxPYQnYl9U5.jpg"}, {"id": 781728, "title": "Meteor Moon", "year": "2020", "overview": "When a meteor crashes into the moon and shifts its axis, Earth's gravity pulls the moon into the path of the planet. Now, a group of scientists must figure out how to stop the moon from hitting the earth before it's too late.", "poster_path": "/pqi519jCXLW0OUY1KAzjsH3B8c6.jpg"}, {"id": 1644578, "title": "The Meteor", "year": "1969", "overview": "The play is set in a painter's studio, where we find Nobel Prize author Wolfgang Schwitter, who has died and come back to life, as he will a second time in the course of the play. Declared clinically dead, Wolfgang Schwitter has fled the hospital, with its doctors and gadgets, to Nyffenschwander's studio, where years before he had begun his literary career and where he now wants to die, yet cannot.", "poster_path": ""}, {"id": 484892, "title": "Meteor and Shadow", "year": "1985", "overview": "A biopic about the rise and fall of one of Greece's most esteemed poets, Napoleon Lapathiotis.", "poster_path": "/pUbzXFJg59IDBTyECXmmJsD9eyR.jpg"}]}, {"handle": "hype", "title": "Hype!", "vendor": "Unknown", "genre": "documentary", "reason": "ambiguous match (best candidate: 'Hype!' (1996))", "candidates": [{"id": 1751509, "title": "Hyper Misao Produce ~HYPE!3~", "year": "2025", "overview": "It's HYPE!3 time! Hyper Misao has taped herself to a chair to complete the script for the show, but then she and Yuki Aino switch bodies after bumping heads, and Misao's body is kidnapped by a mysterious stranger. The show must go on at the Kitazawa Town Hall all the same!", "poster_path": "/pzNyQ8uhHj3bCVCEBIYLNxpPO0e.jpg"}, {"id": 30180, "title": "Hype!", "year": "1996", "overview": "This documentary examines the Seattle scene as it became the focus of a merging of punk rock, heavy metal, and innovation. Building from the grass roots, self-promoted and self-recorded until break-out success of bands like Nirvana brought the record industry to the Pacific Northwest, a phenomenon was born.", "poster_path": "/vfR9veCwZMZXfpCF5QlnaLFoSr1.jpg"}, {"id": 706221, "title": "Hype", "year": "2019", "overview": "A group of filmakers decide to catch the hype on Youtube.", "poster_path": "/8s2ZPH3KinS8VY7zVwkJotGanhh.jpg"}, {"id": 567957, "title": "Party Hype", "year": "2018", "overview": "In a summer they won't forget, two broke college students start filming parties for money. Hello dollar signs. Goodbye morals. Welcome to the night club scene.", "poster_path": "/h2gBJB7VdiusaUqfq3sjj2awGaR.jpg"}, {"id": 609293, "title": "Hype Master", "year": "2019", "overview": "Shaun Lewis AKA Stormin was one of the pioneers of Grime. While sharing the story of his rise to mainstream fame from the underground scene, his battle with cancer returns.", "poster_path": ""}]}];
const BATCH_ID = "out-no-media-format";
const STORAGE_KEY = "tmdb-review-picks::" + BATCH_ID;
const MANUAL_KEY = "tmdb-review-manual::" + BATCH_ID;
const HIDE_DECIDED_KEY = "tmdb-review-hide-decided::" + BATCH_ID;
// Pre-namespacing pages all wrote to this one shared key. Migrate any
// entries for this batch's own handles into the namespaced key below,
// so picks made before this page was regenerated aren't lost.
const LEGACY_STORAGE_KEY = "tmdb-review-picks";
const LEGACY_MANUAL_KEY = "tmdb-review-manual";

function loadStored(key) {
  try { return JSON.parse(localStorage.getItem(key)) || {}; }
  catch (e) { return {}; }
}
let picks = loadStored(STORAGE_KEY);
let manualData = loadStored(MANUAL_KEY);

// One-time migration: pull this batch's own handles out of the old shared
// key, so picks made before namespacing existed aren't lost or, worse,
// don't leak other batches' decided counts into this page's counter.
(function migrateLegacyPicks() {
  const handles = new Set(PRODUCTS.map(p => p.handle));
  const legacyPicks = loadStored(LEGACY_STORAGE_KEY);
  const legacyManual = loadStored(LEGACY_MANUAL_KEY);
  let changed = false;
  for (const handle of Object.keys(legacyPicks)) {
    if (handles.has(handle) && !(handle in picks)) {
      picks[handle] = legacyPicks[handle];
      changed = true;
    }
  }
  for (const handle of Object.keys(legacyManual)) {
    if (handles.has(handle) && !(handle in manualData)) {
      manualData[handle] = legacyManual[handle];
      changed = true;
    }
  }
  if (changed) savePicks();
})();

function savePicks() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(picks));
  localStorage.setItem(MANUAL_KEY, JSON.stringify(manualData));
}

function esc(text) {
  const div = document.createElement("div");
  div.textContent = text || "";
  return div.innerHTML;
}

function optionHtml(handle, value, checked, extraClass, inner) {
  return `<label class="option ${extraClass}">
    <input type="radio" name="pick-${esc(handle)}" value="${value}" ${checked ? "checked" : ""}>
    ${inner}
  </label>`;
}

function render() {
  const cards = document.getElementById("cards");
  cards.innerHTML = PRODUCTS.map(product => {
    const current = picks[product.handle];
    const searchUrl = "https://www.themoviedb.org/search?query=" + encodeURIComponent(product.title);
    const googleUrl = "https://www.google.com/search?q=" + encodeURIComponent(product.title + " movie");
    const options = product.candidates.map((candidate, i) => {
      const poster = candidate.poster_path
        ? `<img src="https://image.tmdb.org/t/p/w185${esc(candidate.poster_path)}" alt="" loading="lazy">`
        : '<div class="no-poster">no poster</div>';
      const overview = candidate.overview ? esc(candidate.overview) : "<em>(no overview)</em>";
      return optionHtml(product.handle, String(i), current === String(i), "",
        `${poster}<span class="info"><strong>${esc(candidate.title)}</strong> (${esc(candidate.year) || "?"})<br>${overview}</span>`);
    }).join("");
    const tags = [product.vendor, product.genre].filter(Boolean);
    const tagsHtml = tags.length
      ? `<span class="tags">${tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</span>`
      : "";
    return `<section class="card ${current !== undefined ? "decided" : ""}" data-handle="${esc(product.handle)}">
      <h2>${esc(product.title)} ${tagsHtml}</h2>
      <div class="meta"><code>${esc(product.handle)}</code> — ${esc(product.reason)}
        · <a href="${searchUrl}" target="_blank">TMDB search</a>
        · <a href="${googleUrl}" target="_blank">Google</a></div>
      <div class="candidates">
        ${options}
        ${optionHtml(product.handle, "manual", current === "manual", "special",
          `<span class="info" style="flex:1"><strong>Manual entry</strong> — fill in what you found
            <span class="manual-fields">
              <input type="url" class="manual-image" placeholder="Image URL (leave blank to keep current)"
                     value="${esc((manualData[product.handle] || {}).image_src || "")}">
              <textarea class="manual-overview" placeholder="Description (leave blank to keep current)">${esc((manualData[product.handle] || {}).overview || "")}</textarea>
            </span>
          </span>`)}
        ${optionHtml(product.handle, "skip", current === "skip", "special",
          '<span class="info"><strong>Skip this one</strong> — leave it for a later pass</span>')}
        ${optionHtml(product.handle, "undecided", current === undefined, "",
          '<span class="info">Decide later</span>')}
      </div>
    </section>`;
  }).join("");
  updateCounter();
}

function updateCounter() {
  const decided = Object.keys(picks).length;
  document.getElementById("counter").textContent = `${decided} / ${PRODUCTS.length} decided`;
}

const hideDecidedBox = document.getElementById("hide-decided");
hideDecidedBox.checked = localStorage.getItem(HIDE_DECIDED_KEY) === "1";
document.body.classList.toggle("hide-decided", hideDecidedBox.checked);
hideDecidedBox.addEventListener("change", () => {
  document.body.classList.toggle("hide-decided", hideDecidedBox.checked);
  localStorage.setItem(HIDE_DECIDED_KEY, hideDecidedBox.checked ? "1" : "0");
});

document.getElementById("cards").addEventListener("change", event => {
  const input = event.target;
  if (input.type !== "radio") return;
  const handle = input.closest(".card").dataset.handle;
  if (input.value === "undecided") {
    delete picks[handle];
  } else {
    picks[handle] = input.value;
  }
  savePicks();
  input.closest(".card").classList.toggle("decided", picks[handle] !== undefined);
  updateCounter();
});

document.getElementById("cards").addEventListener("input", event => {
  const input = event.target;
  if (!input.classList.contains("manual-image") && !input.classList.contains("manual-overview")) return;
  const card = input.closest(".card");
  const handle = card.dataset.handle;
  const fields = manualData[handle] || {};
  if (input.classList.contains("manual-image")) fields.image_src = input.value;
  else fields.overview = input.value;
  manualData[handle] = fields;
  // Typing in a manual field selects that card's Manual option.
  if (picks[handle] !== "manual") {
    picks[handle] = "manual";
    const radio = card.querySelector('input[type="radio"][value="manual"]');
    if (radio) radio.checked = true;
    card.classList.add("decided");
    updateCounter();
  }
  savePicks();
});

document.getElementById("export").addEventListener("click", () => {
  const out = [];
  for (const product of PRODUCTS) {
    const pick = picks[product.handle];
    if (pick === undefined) continue;
    if (pick === "skip") {
      out.push({handle: product.handle, choice: "skip"});
    } else if (pick === "manual") {
      const fields = manualData[product.handle] || {};
      const image_src = (fields.image_src || "").trim();
      const overview = (fields.overview || "").trim();
      if (!image_src && !overview) continue; // nothing typed — skip
      out.push({handle: product.handle, choice: "manual", image_src, overview});
    } else {
      const candidate = product.candidates[Number(pick)];
      if (!candidate) continue;
      out.push({
        handle: product.handle,
        choice: "tmdb",
        poster_path: candidate.poster_path,
        overview: candidate.overview,
      });
    }
  }
  const blob = new Blob([JSON.stringify(out, null, 2)], {type: "application/json"});
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "tmdb-picks.json";
  link.click();
  URL.revokeObjectURL(link.href);
});

render();
</script>
</body>
</html>
